name: "WM Tapper: Build for Linux"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (example: v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

defaults:
  run:
    working-directory: tapper

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Tauri (Linux AppImage)
        run: npm run tauri build -- --bundles appimage

      - name: Rename installer
        shell: bash
        run: |
          set -e
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage not found"
            ls -la src-tauri/target/release/bundle/appimage || true
            exit 1
          fi
          cp "$APPIMAGE" src-tauri/target/release/bundle/appimage/wm-tapper-linux.AppImage
          echo "Ready: $APPIMAGE -> wm-tapper-linux.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wm-tapper-linux
          path: tapper/src-tauri/target/release/bundle/appimage/wm-tapper-linux.AppImage
          if-no-files-found: error

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: WM Tapper ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: tapper/src-tauri/target/release/bundle/appimage/wm-tapper-linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
