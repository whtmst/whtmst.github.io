name: "WM Tapper: Build for Windows"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (example: v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

defaults:
  run:
    working-directory: tapper

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Tauri (Windows)
        run: npm run tauri build

      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "NSIS installer .exe not found"
          }
          Copy-Item $exe.FullName "src-tauri/target/release/bundle/nsis/wm-tapper-windows-setup.exe" -Force
          Write-Host "Installer ready: $($exe.Name) -> wm-tapper-windows-setup.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wm-tapper-windows
          path: tapper/src-tauri/target/release/bundle/nsis/wm-tapper-windows-setup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: WM Tapper ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: tapper/src-tauri/target/release/bundle/nsis/wm-tapper-windows-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
